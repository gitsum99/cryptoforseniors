<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security First</title><style>body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,sans-serif}header{padding:14px 20px;background:#111;display:flex;justify-content:space-between}a,h1,h2{color:#9fd3ff}a{text-decoration:none;font-weight:bold}select{background:#1a1a1a;color:#eee;padding:8px}main{max-width:900px;margin:auto;padding:40px 20px}.s{margin:24px 0;padding:20px;background:#121212;border:1px solid #333;border-radius:8px}</style></head><body><header><a href="../" id="back"></a><select id="lang"></select></header><main><h1 id="title"></h1><p id="intro"></p><div class="s"><h2 id="core"></h2><ul id="coreList"></ul></div><div class="s"><h2 id="never"></h2><ul id="neverList"></ul></div><div class="s"><h2 id="why"></h2><p id="whyText"></p></div><p id="notice"></p></main><script src="../assets/translations.js"></script><script src="../assets/i18n.js"></script><script>const N={en:'English',fr:'Français',es:'Español',hr:'Hrvatski',tl:'Filipino',ja:'日本語','zh-cn':'中文（简体）','zh-tw':'中文（繁體）',ar:'العربية',no:'Norsk',sv:'Svenska',az:'Azərbaycanca',uk:'Українська',nl:'Nederlands',fa:'فارسی'};const B={en:'← Return to Main Page',fr:'← Retour à la page principale',es:'← Volver a la página principal',hr:'← Povratak na glavnu stranicu',tl:'← Bumalik sa Pangunahing Pahina',ja:'← メインページに戻る','zh-cn':'← 返回主页','zh-tw':'← 返回主頁',ar:'← العودة إلى الصفحة الرئيسية',no:'← Tilbake til hovedsiden',sv:'← Tillbaka till huvudsidan',az:'← Əsas səhifəyə qayıt',uk:'← Повернутися на головну',nl:'← Terug naar hoofdpagina',fa:'← بازگشت به صفحه اصلی'};const T={en:['Security First','Security is the foundation of Crypto For Seniors.','Core Security Principles','Education before action|Practice before real-world risk|Clarity over complexity|No urgency or pressure','What We Never Do','Ask for private keys, seed phrases or passwords|Connect practice tools to real accounts|Execute real trades from Practice Mode|Hide actions or decisions','Why This Matters','Urgency, confusion and manipulation cause avoidable losses. CFS is deliberately transparent.','If something feels urgent or secretive, stop and verify.'],fr:['La sécurité avant tout','La sécurité est la base de Crypto For Seniors.','Principes de sécurité','Apprendre avant d’agir|Pratiquer avant le risque réel|Clarté avant complexité|Aucune urgence ni pression','Ce que nous ne faisons jamais','Demander clés privées, phrases de récupération ou mots de passe|Relier la pratique à des comptes réels|Exécuter de vrais trades depuis le mode pratique|Cacher des actions ou décisions','Pourquoi c’est important','Urgence, confusion et manipulation peuvent causer des pertes évitables.','Si quelque chose semble urgent ou secret, arrêtez et vérifiez.'],es:['Seguridad primero','La seguridad es la base de Crypto For Seniors.','Principios de seguridad','Educación antes de actuar|Práctica antes del riesgo real|Claridad sobre complejidad|Sin urgencia ni presión','Lo que nunca hacemos','Pedir claves privadas, frases semilla o contraseñas|Conectar práctica con cuentas reales|Ejecutar operaciones reales desde práctica|Ocultar acciones o decisiones','Por qué importa','La urgencia, confusión y manipulación pueden causar pérdidas evitables.','Si algo parece urgente o secreto, deténgase y verifique.'],hr:['Sigurnost na prvom mjestu','Sigurnost je temelj Crypto For Seniors.','Temeljna sigurnosna načela','Edukacija prije djelovanja|Vježba prije stvarnog rizika|Jasnoća prije složenosti|Bez žurbe ili pritiska','Što nikada ne radimo','Tražiti privatne ključeve, seed fraze ili lozinke|Povezivati vježbu sa stvarnim računima|Izvršavati stvarne trgovine iz vježbe|Skrivati radnje ili odluke','Zašto je važno','Žurba, zbunjenost i manipulacija mogu uzrokovati gubitke.','Ako nešto djeluje hitno ili tajno, stanite i provjerite.'],tl:['Unahin ang Seguridad','Seguridad ang pundasyon ng Crypto For Seniors.','Pangunahing Prinsipyo','Edukasyon bago aksyon|Practice bago totoong risk|Linaw bago komplikasyon|Walang pagmamadali o pressure','Hindi Namin Ginagawa','Humingi ng private keys, seed phrase o password|Ikonekta ang practice sa totoong account|Gumawa ng totoong trade mula Practice Mode|Magtago ng aksyon o desisyon','Bakit Mahalaga','Ang pagmamadali, kalituhan at manipulasyon ay maaaring magdulot ng pagkawala.','Kapag urgent o sikreto ang pakiramdam, huminto at mag-verify.'],ja:['セキュリティ最優先','セキュリティはCrypto For Seniorsの基盤です。','基本セキュリティ原則','行動前に学ぶ|実際のリスク前に練習|複雑さより明確さ|焦りや圧力なし','絶対にしないこと','秘密鍵・シードフレーズ・パスワードを求める|練習ツールを実口座に接続|練習モードから実取引を実行|行動や判断を隠す','なぜ重要か','焦り、混乱、操作は避けられる損失につながります。','急かされたり秘密を求められたら止まって確認してください。'],'zh-cn':['安全优先','安全是Crypto For Seniors的基础。','核心安全原则','行动前先学习|真实风险前先练习|清晰胜于复杂|不制造紧迫或压力','我们绝不会做什么','索要私钥、助记词或密码|把练习工具连接真实账户|从练习模式执行真实交易|隐藏操作或决定','为什么重要','紧迫、混乱和操纵会造成可避免的损失。','如果事情显得紧急或秘密，请停止并核实。'],'zh-tw':['安全優先','安全是Crypto For Seniors的基礎。','核心安全原則','行動前先學習|真實風險前先練習|清楚勝於複雜|不製造急迫或壓力','我們絕不會做什麼','索取私鑰、助記詞或密碼|把練習工具連接真實帳戶|從練習模式執行真實交易|隱藏操作或決定','為什麼重要','急迫、混亂和操縱會造成可避免的損失。','如果事情顯得緊急或秘密，請停止並核實。'],ar:['الأمان أولاً','الأمان هو أساس Crypto For Seniors.','مبادئ الأمان الأساسية','التعلم قبل التصرف|التدريب قبل المخاطرة الحقيقية|الوضوح قبل التعقيد|لا استعجال أو ضغط','ما لا نفعله أبداً','طلب المفاتيح الخاصة أو عبارات الاسترداد أو كلمات المرور|ربط أدوات التدريب بحسابات حقيقية|تنفيذ تداول حقيقي من وضع التدريب|إخفاء الإجراءات أو القرارات','لماذا هذا مهم','الاستعجال والارتباك والتلاعب قد تسبب خسائر يمكن تجنبها.','إذا بدا الأمر عاجلاً أو سرياً، توقف وتحقق.'],no:['Sikkerhet først','Sikkerhet er grunnlaget for Crypto For Seniors.','Grunnleggende sikkerhetsprinsipper','Læring før handling|Øving før virkelig risiko|Klarhet fremfor kompleksitet|Ingen hast eller press','Hva vi aldri gjør','Ber om private nøkler, seed-fraser eller passord|Kobler øving til ekte kontoer|Utfører ekte handler fra øvingsmodus|Skjuler handlinger eller beslutninger','Hvorfor dette er viktig','Hastverk, forvirring og manipulasjon kan gi unødvendige tap.','Hvis noe virker presserende eller hemmelig, stopp og kontroller.'],sv:['Säkerheten först','Säkerhet är grunden för Crypto For Seniors.','Grundläggande säkerhetsprinciper','Utbildning före handling|Övning före verklig risk|Tydlighet före komplexitet|Ingen brådska eller press','Vad vi aldrig gör','Ber om privata nycklar, seed-fraser eller lösenord|Kopplar övning till riktiga konton|Utför riktiga affärer från övningsläge|Döljer handlingar eller beslut','Varför detta är viktigt','Brådska, förvirring och manipulation kan orsaka undvikbara förluster.','Om något känns brådskande eller hemligt, stanna och kontrollera.'],az:['Əvvəlcə təhlükəsizlik','Təhlükəsizlik Crypto For Seniors layihəsinin təməlidir.','Əsas təhlükəsizlik prinsipləri','Hərəkətdən əvvəl təhsil|Real riskdən əvvəl təcrübə|Mürəkkəblikdən üstün aydınlıq|Tələsmə və təzyiq yoxdur','Heç vaxt nə etmirik','Şəxsi açar, seed ifadəsi və ya parol istəmək|Təcrübəni real hesablara qoşmaq|Təcrübə rejimindən real ticarət etmək|Hərəkət və qərarları gizlətmək','Niyə vacibdir','Tələskənlik, qarışıqlıq və manipulyasiya itkilərə səbəb ola bilər.','Nəsə təcili və ya gizli görünürsə, dayanın və yoxlayın.'],uk:['Безпека передусім','Безпека — основа Crypto For Seniors.','Основні принципи безпеки','Навчання перед дією|Практика перед реальним ризиком|Ясність замість складності|Без поспіху чи тиску','Чого ми ніколи не робимо','Не просимо приватні ключі, seed-фрази чи паролі|Не підключаємо практику до реальних рахунків|Не виконуємо реальні угоди з режиму практики|Не приховуємо дії чи рішення','Чому це важливо','Поспіх, плутанина та маніпуляції можуть спричинити втрати.','Якщо щось здається терміновим або секретним, зупиніться й перевірте.'],nl:['Veiligheid eerst','Veiligheid is de basis van Crypto For Seniors.','Belangrijkste veiligheidsprincipes','Leren vóór handelen|Oefenen vóór echt risico|Duidelijkheid boven complexiteit|Geen haast of druk','Wat we nooit doen','Vragen om privésleutels, seed phrases of wachtwoorden|Oefentools verbinden met echte accounts|Echte transacties uitvoeren vanuit oefenmodus|Acties of beslissingen verbergen','Waarom dit belangrijk is','Haast, verwarring en manipulatie kunnen vermijdbare verliezen veroorzaken.','Als iets dringend of geheim voelt, stop en controleer.'],fa:['اول امنیت','امنیت پایه Crypto For Seniors است.','اصول اصلی امنیت','آموزش پیش از اقدام|تمرین پیش از ریسک واقعی|شفافیت پیش از پیچیدگی|بدون عجله یا فشار','کارهایی که هرگز انجام نمی‌دهیم','درخواست کلید خصوصی، عبارت بازیابی یا رمز عبور|اتصال تمرین به حساب واقعی|اجرای معامله واقعی از حالت تمرین|پنهان کردن اقدامات یا تصمیم‌ها','چرا مهم است','عجله، سردرگمی و دستکاری می‌تواند باعث زیان قابل پیشگیری شود.','اگر چیزی فوری یا محرمانه به نظر می‌رسد، توقف و بررسی کنید.']};CFSI18n.extend('security',T,N,B);Object.entries(N).forEach(([v,n])=>lang.add(new Option(n,v)));let li=s=>s.split('|').map(x=>'<li>'+x+'</li>').join('');function apply(l){l=CFSI18n.normalize(l);CFSI18n.select(l);document.documentElement.lang=l;document.documentElement.dir=['ar','fa'].includes(l)?'rtl':'ltr';let x=T[l];back.textContent=B[l];title.textContent=x[0];intro.textContent=x[1];core.textContent=x[2];coreList.innerHTML=li(x[3]);never.textContent=x[4];neverList.innerHTML=li(x[5]);why.textContent=x[6];whyText.textContent=x[7];notice.textContent=x[8]}let s=CFSI18n.saved();lang.value=T[s]?s:'en';apply(lang.value);lang.onchange=e=>apply(e.target.value)</script></body></html>
