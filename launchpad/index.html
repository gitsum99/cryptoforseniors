Volver a la página principal','CFS Launchpad — Meme Coins y NFTs','Launchpad explica cómo se crean y lanzan meme coins y NFTs. Solo educación.','Meme Coins','Los meme coins dependen de narrativa, momento, liquidez y confianza.','Los NFTs son registros blockchain vinculados a medios y metadatos.','Solo educación. Sin trading ni asesoría financiera.'],hr:['← Povratak na glavnu stranicu','CFS Launchpad — Meme coinovi i NFT-ovi','Launchpad objašnjava kako se stvaraju i pokreću meme coinovi i NFT-ovi.','Meme coinovi','Meme coinovi ovise o priči, vremenu, likvidnosti i povjerenju.','NFT-ovi su blockchain zapisi povezani s medijima i metapodacima.','Samo edukacija. Bez trgovanja ili financijskih savjeta.'],tl:['← Bumalik sa Pangunahing Pahina','CFS Launchpad — Meme Coins at NFTs','Ipinapaliwanag ng Launchpad kung paano ginagawa at inilalabas ang meme coins at NFTs.','Meme Coins','Nakadepende ang meme coins sa kuwento, timing, liquidity at tiwala.','Ang NFTs ay blockchain records na tumuturo sa media at metadata.','Pang-edukasyon lamang. Walang trading o payong pinansyal.'],ja:['← メインページに戻る','CFS Launchpad — ミームコインとNFT','ミームコインとNFTの作成と市場投入を説明します。教育目的のみです。','ミームコイン','ミームコインは物語、タイミング、流動性、信頼に左右されます。','NFTはメディアやメタデータを指すブロックチェーン記録です。','教育目的のみ。取引や金融助言ではありません。'],'zh-cn':['← 返回主页','CFS Launchpad — 模因币与 NFT','介绍模因币和NFT如何创建并进入市场。仅供教育。','模因币','模因币受叙事、时机、流动性和信任影响。','NFT是指向媒体和元数据的区块链记录。','仅供教育。不交易，不提供金融建议。'],'zh-tw':['← 返回主頁','CFS Launchpad — 迷因幣與 NFT','介紹迷因幣和NFT如何建立並進入市場。僅供教育。','迷因幣','迷因幣受敘事、時機、流動性和信任影響。','NFT是指向媒體與中繼資料的區塊鏈紀錄。','僅供教育。不交易，不提供金融建議。'],ar:['← العودة إلى الصفحة الرئيسية','CFS Launchpad — عملات الميم وNFT','يشرح Launchpad كيفية إنشاء عملات الميم وNFT وطرحها في السوق. للتعليم فقط.','عملات الميم','تعتمد عملات الميم على السرد والتوقيت والسيولة والثقة.','NFT سجلات بلوكتشين تشير إلى الوسائط والبيانات الوصفية.','للتعليم فقط. لا محافظ أو تداول أو نصائح مالية.'],no:['← Tilbake til hovedsiden','CFS Launchpad — Meme-mynter og NFT-er','Launchpad forklarer hvordan meme-mynter og NFT-er lages og lanseres. Kun læring.','Meme-mynter','Meme-mynter påvirkes av fortelling, timing, likviditet og tillit.','NFT-er er blokkjedeoppføringer som peker til medier og metadata.','Kun læring. Ingen handel eller finansielle råd.'],sv:['← Tillbaka till huvudsidan','CFS Launchpad — Meme-mynt och NFT','Launchpad förklarar hur meme-mynt och NFT skapas och lanseras. Endast utbildning.','Meme-mynt','Meme-mynt påverkas av berättelse, timing, likviditet och förtroende.','NFT är blockkedjeposter som pekar på media och metadata.','Endast utbildning. Ingen handel eller finansiell rådgivning.'],az:['← Əsas səhifəyə qayıt','CFS Launchpad — Meme coinlər və NFT-lər','Launchpad meme coin və NFT-lərin necə yaradılıb bazara çıxarıldığını izah edir.','Meme coinlər','Meme coinlər hekayə, zamanlama, likvidlik və etibardan asılıdır.','NFT-lər media və metadataya işarə edən blokçeyn qeydləridir.','Yalnız təhsil. Ticarət və maliyyə məsləhəti yoxdur.'],uk:['← Повернутися на головну','CFS Launchpad — Мемкоїни та NFT','Launchpad пояснює, як створюються і виходять на ринок мемкоїни та NFT.','Мемкоїни','Мемкоїни залежать від наративу, часу, ліквідності та довіри.','NFT — записи блокчейну, що вказують на медіа та метадані.','Лише навчання. Без торгівлі та фінансових порад.'],nl:['← Terug naar hoofdpagina','CFS Launchpad — Meme coins & NFTs','Launchpad legt uit hoe meme coins en NFTs worden gemaakt en gelanceerd. Alleen educatief.','Meme coins','Meme coins worden beïnvloed door verhaal, timing, liquiditeit en vertrouwen.','NFTs zijn blockchainrecords die verwijzen naar media en metadata.','Alleen educatief. Geen handel of financieel advies.'],fa:['← بازگشت به صفحه اصلی','CFS Launchpad — میم‌کوین و NFT','Launchpad توضیح می‌دهد میم‌کوین‌ها و NFTها چگونه ساخته و وارد بازار می‌شوند. فقط آموزشی.','میم‌کوین‌ها','میم‌کوین‌ها به روایت، زمان‌بندی، نقدینگی و اعتماد وابسته‌اند.','NFTها رکوردهای بلاکچین مرتبط با رسانه و فراداده هستند.','فقط آموزشی. بدون معامله یا توصیه مالی.']};Object.entries(names).forEach(([v,n])=>lang.add(new Option(n,v)));function apply(l){if(!X[l])l='en';localStorage.setItem('cfs-lang',l);document.documentElement.lang=l;document.documentElement.dir=['ar','fa'].includes(l)?'rtl':'ltr';[back,title,intro,memeTitle,memeText,nftText,notice].forEach((e,i)=>e.textContent=X[l][i])}let s=localStorage.getItem('cfs-lang')||'en';lang.value=X[s]?s:'en';apply(lang.value);lang.onchange=e=>apply(e.target.value)</script></body></html>
