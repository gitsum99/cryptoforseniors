<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13-Wallet Closed Market Lab</title><style>body{font-family:Arial,sans-serif;max-width:1050px;margin:auto;padding:20px;background:#101318;color:#eee}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.home{color:#9fd3ff;text-decoration:none;font-weight:bold}select{background:#1d222b;color:#eee;padding:8px}h1,h2{color:#8ee6a8}.notice,.panel{padding:14px;background:#1d222b;border-radius:8px;margin:14px 0}.notice{border:1px solid #3d8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.card{background:#1d222b;padding:10px;border-radius:8px}button{padding:12px 16px;font-size:16px;margin:5px}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #444;text-align:start}.bar{height:18px;background:#777;margin:4px 0}.small{color:#bbb}.warn{color:#ffd28a}.link{border-inline-start:4px solid #ffd28a;padding:10px;margin:8px 0;background:#181c23}</style></head><body><div class="top"><a class="home" href="../../" id="home"></a><select id="lang"></select></div><h1 id="title"></h1><div class="notice"><b id="practice"></b> <span id="notice"></span></div><p id="desc"></p><button id="run"></button><button id="next"></button><button id="reveal"></button><button id="reset"></button><div id="stats" class="panel"></div><h2 id="marketTitle"></h2><div id="market" class="panel"></div><h2 id="walletTitle"></h2><div id="wallets" class="grid"></div><div id="links"></div><h2 id="logTitle"></h2><div class="panel"><table><thead><tr><th>#</th><th id="thPrice"></th><th id="thVolume"></th><th id="thEvent"></th></tr></thead><tbody id="log"></tbody></table></div><p class="small" id="foot"></p><script>

en:['← Return to Main Page','13-Wallet Closed Market Lab','PRACTICE ONLY.','13 fictional wallets × 1 practice unit. No blockchain connection, wallet keys or real transactions.','This closed simulation demonstrates staged entries and exits and synthetic warning patterns for manipulation awareness.','Run Full Scenario','Next Step','Reveal Hidden Wallet Links','Reset','Market','13 Wallets','Event Log','Price','Displayed volume','Closed-lab event','All prices, volume and wallet relationships are synthetic variables inside this page.','Starting capital','Current combined value','P/L','Wallets used','Synthetic price','Displayed synthetic volume index','Many wallets do not necessarily mean many independent traders.','Wallet','Reserve','Leader / decoy display','Holding','Exited','Trades','Value','Realized','Wallet Relationship Investigator','These fictional wallets can look independent. Synthetic forensic clues below demonstrate how analysts may detect common control.','Timing cluster: related wallets act in the same simulated event window.','Funding clue: some wallets share a fictional common-origin tag.','Behavior fingerprint: several wallets enter and exit around the same synthetic events.','Concentration clue: grouping related wallets can reveal a larger combined position.','Leader/decoy clue: a visibly successful wallet may belong to the same synthetic cluster.','Detection lesson: examine timing, relationships, funding provenance, behavior and combined concentration.','This defensive lesson does not teach concealment of real wallet ownership.'],
fr:['← Retour à la page principale','Laboratoire fermé à 13 portefeuilles','PRATIQUE UNIQUEMENT.','13 portefeuilles fictifs × 1 unité de pratique. Aucune blockchain, clé ou transaction réelle.','Simulation fermée des entrées/sorties échelonnées et des signaux synthétiques de manipulation.','Exécuter le scénario','Étape suivante','Révéler les liens cachés','Réinitialiser','Marché','13 portefeuilles','Journal des événements','Prix','Volume affiché','Événement simulé','Tous les prix, volumes et liens sont synthétiques.','Capital initial','Valeur combinée','G/P','Portefeuilles utilisés','Prix synthétique','Indice de volume synthétique','Plusieurs portefeuilles ne signifient pas plusieurs traders indépendants.','Portefeuille','Réserve','Affichage leader/leurre','En position','Sorti','Transactions','Valeur','Réalisé','Enquêteur des relations','Ces portefeuilles fictifs peuvent sembler indépendants. Les indices montrent comment détecter un contrôle commun.','Groupe temporel : des portefeuilles liés agissent ensemble.','Financement : certains partagent une origine fictive.','Comportement : plusieurs agissent autour des mêmes événements.','Concentration : regrouper les portefeuilles révèle une position plus grande.','Leader/leurre : un portefeuille visible peut appartenir au même groupe.','Leçon : examinez le timing, les relations, le financement, le comportement et la concentration.','Cette leçon défensive n’enseigne pas à cacher la propriété réelle.'],
es:['← Volver a la página principal','Laboratorio cerrado de 13 billeteras','SOLO PRÁCTICA.','13 billeteras ficticias × 1 unidad de práctica. Sin blockchain, claves ni transacciones reales.','Simulación cerrada de entradas/salidas escalonadas y señales sintéticas de manipulación.','Ejecutar escenario','Siguiente paso','Revelar vínculos ocultos','Reiniciar','Mercado','13 billeteras','Registro de eventos','Precio','Volumen mostrado','Evento simulado','Todos los precios, volúmenes y relaciones son sintéticos.','Capital inicial','Valor combinado','G/P','Billeteras usadas','Precio sintético','Índice de volumen sintético','Muchas billeteras no significan muchos operadores independientes.','Billetera','Reserva','Líder/señuelo','Manteniendo','Salió','Operaciones','Valor','Realizado','Investigador de relaciones','Las billeteras pueden parecer independientes; las pistas muestran cómo detectar control común.','Grupo temporal: billeteras relacionadas actúan juntas.','Financiación: algunas comparten un origen ficticio.','Comportamiento: varias actúan en los mismos eventos.','Concentración: agruparlas revela una posición mayor.','Líder/señuelo: una billetera visible puede pertenecer al mismo grupo.','Lección: examine tiempo, relaciones, financiación, conducta y concentración.','Esta lección defensiva no enseña a ocultar propiedad real.']};

const common={hr:['SAMO VJEŽBA.','13 izmišljenih novčanika × 1 jedinica za vježbu. Nema blockchain veze, ključeva ni stvarnih transakcija.'],tl:['PRACTICE LANG.','13 fictional wallet × 1 practice unit. Walang blockchain, keys o totoong transaksyon.'],ja:['練習専用。','架空の13ウォレット×1練習単位。ブロックチェーン接続、鍵、実取引はありません。'],'zh-cn':['仅限练习。','13个虚构钱包×1练习单位。无区块链连接、密钥或真实交易。'],'zh-tw':['僅限練習。','13個虛構錢包×1練習單位。無區塊鏈連接、金鑰或真實交易。'],ar:['للتدريب فقط.','13 محفظة خيالية × وحدة تدريب واحدة. لا اتصال ببلوكتشين أو مفاتيح أو معاملات حقيقية.'],no:['KUN ØVING.','13 fiktive lommebøker × 1 øvingsenhet. Ingen blokkjede, nøkler eller ekte transaksjoner.'],sv:['ENDAST ÖVNING.','13 fiktiva plånböcker × 1 övningsenhet. Ingen blockkedja, nycklar eller riktiga transaktioner.'],az:['YALNIZ TƏCRÜBƏ.','13 uydurma pul kisəsi × 1 təcrübə vahidi. Blockchain, açar və real əməliyyat yoxdur.'],uk:['ЛИШЕ ПРАКТИКА.','13 вигаданих гаманців × 1 навчальна одиниця. Без блокчейну, ключів і реальних транзакцій.'],nl:['ALLEEN OEFENEN.','13 fictieve wallets × 1 oefeneenheid. Geen blockchain, sleutels of echte transacties.'],fa:['فقط تمرین.','۱۳ کیف پول ساختگی × ۱ واحد تمرینی. بدون اتصال بلاکچین، کلید یا تراکنش واقعی.']};
for(const l in extra){let e=[...base.en];e[0]=extra[l][0];e[1]=extra[l][1];e[2]=common[l][0];e[3]=common[l][1];base[l]=e}Object.entries(names).forEach(([v,n])=>lang.add(new Option(n,v)));
const events=[{p:10,v:8,b:[1,2,3],s:[]},{p:12,v:18,b:[4,5],s:[]},{p:8.5,v:14,b:[],s:[2]},{p:10.5,v:24,b:[6,7,8],s:[]},{p:14,v:38,b:[],s:[1,3,4,5]},{p:11,v:31,b:[9,10,11],s:[]},{p:17,v:55,b:[],s:[6,7,8,9]},{p:7,v:20,b:[],s:[]}];let wallets=[],i=0,displayVol=0,L='en';const q=id=>document.getElementById(id),tr=n=>base[L][n];function init(){wallets=Array.from({length:13},(_,x)=>({id:x+1,cash:1,tok:0,real:0,trades:0,status:x===0?24:23}));i=0;displayVol=0;q('log').innerHTML='';q('links').innerHTML='';draw(10);stats(10)}function buy(ids,p){ids.forEach(n=>{let w=wallets[n-1];if(w.cash){w.tok=w.cash/p;w.cash=0;w.trades++;w.status=25}})}function sell(ids,p){ids.forEach(n=>{let w=wallets[n-1];if(w.tok){let z=w.tok*p;w.real+=z-1;w.cash=z;w.tok=0;w.trades++;w.status=26}})}function val(w,p){return w.cash+w.tok*p}function draw(p){q('wallets').innerHTML=wallets.map(w=>`<div class="card"><b>${tr(22)} ${w.id}</b><br>${tr(w.status)}<br>${tr(27)}: ${w.trades}<br>${tr(28)}: ${val(w,p).toFixed(2)}<br>${tr(29)}: ${w.real>=0?'+':''}${w.real.toFixed(2)}</div>`).join('')}function stats(p){let t=wallets.reduce((s,w)=>s+val(w,p),0),a=wallets.filter(w=>w.trades).length;q('stats').innerHTML=`${tr(16)}: <b>13.00</b> &nbsp; ${tr(17)}: <b>${t.toFixed(2)}</b> &nbsp; ${tr(18)}: <b>${t>=13?'+':''}${(t-13).toFixed(2)}</b><br>${tr(19)}: ${a}/13`;q('market').innerHTML=`${tr(20)}: <b>$${p.toFixed(2)}</b><br>${tr(21)}: <b>${displayVol}</b><div class="bar" style="width:${Math.min(displayVol,100)}%"></div><span class="warn">${tr(22-1)}</span>`}function step(){if(i>=events.length)return;let e=events[i];buy(e.b,e.p);sell(e.s,e.p);displayVol=e.v;q('log').innerHTML+=`<tr><td>${i+1}</td><td>$${e.p.toFixed(2)}</td><td>${e.v}</td><td>${tr(4)}</td></tr>`;draw(e.p);stats(e.p);i++}function start(){init();while(i<events.length)step()}function revealLinks(){q('links').innerHTML=`<div class="panel"><h2>${tr(30)}</h2><p>${tr(31)}</p><div class="link">${tr(32)}</div><div class="link">${tr(33)}</div><div class="link">${tr(34)}</div><div class="link">${tr(35)}</div><div class="link">${tr(36)}</div><p><b>${tr(37)}</b></p><p class="small">${tr(38)}</p></div>`}function apply(l){L=base[l]?l:'en';localStorage.setItem('cfs-lang',L);document.documentElement.lang=L;document.documentElement.dir=['ar','fa'].includes(L)?'rtl':'ltr';['home','title','practice','notice','desc','run','next','reveal','reset','marketTitle','walletTitle','logTitle','thPrice','thVolume','thEvent','foot'].forEach((id,j)=>q(id).textContent=tr(j));init()}let s=localStorage.getItem('cfs-lang')||'en';lang.value=base[s]?s:'en';lang.onchange=e=>apply(e.target.value);run.onclick=start;next.onclick=step;reveal.onclick=revealLinks;reset.onclick=init;apply(lang.value);
</script></body></html>
