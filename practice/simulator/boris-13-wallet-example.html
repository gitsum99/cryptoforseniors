<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13 Wallet Practice</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:22px;background:#101318;color:#eee}h1,h2{color:#8ee6a8}.notice{padding:14px;background:#183323;border:1px solid #3d8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:18px 0}.card,.result,.lesson{background:#1d222b;padding:16px;border-radius:8px;margin:16px 0}.card b{font-size:18px}button{padding:14px 20px;font-size:18px;margin:8px 5px}.small{color:#bbb}.flag{border-left:4px solid #e6b450;padding-left:12px;margin:12px 0}</style></head><body><h1>13-Wallet Practice Simulator</h1><div class="notice"><b>PRACTICE ONLY — NO REAL MONEY.</b></div><p><b>Simple setup:</b> 13 practice wallets. Each starts with <b>1 SOL</b>. Total = <b>13 SOL</b>.</p><button onclick="run()">Run 13-Wallet Simulation</button><button onclick="spot()">Spot the Manipulation</button><button onclick="resetSim()">Reset</button><div id="result"></div><div class="grid" id="wallets"></div><div id="lesson"></div><p class="small">Practice price path: $10 → $8.50 → $11 → $9 → $12 → $7. Educational simulation only.</p><script>let wallets=[];function init(){wallets=Array.from({length:13},(_,i)=>({id:i+1,sol:1,token:0,status:'Reserve'}));render();document.getElementById('result').innerHTML='';document.getElementById('lesson').innerHTML=''}function buy(ids,p){ids.forEach(n=>{let w=wallets[n-1];if(w.sol>0){w.token=w.sol/p;w.sol=0;w.status='Bought at $'+p}})}function sell(ids,p){ids.forEach(n=>{let w=wallets[n-1];if(w.token>0){w.sol=w.token*p;w.token=0;w.status='Sold at $'+p}})}function total(p){return wallets.reduce((s,w)=>s+w.sol+w.token*p,0)}function render(){document.getElementById('wallets').innerHTML=wallets.map(w=>`<div class="card"><b>Wallet ${w.id}</b><br>${w.status}<br>Value: ${(w.sol+w.token*7).toFixed(2)} SOL</div>`).join('')}function run(){init();buy([1,2,3],10);buy([4,5,6],8.5);sell([1,2],11);buy([7,8,9],9);sell([3,4,5,6,7,8,9],12);let final=total(7),profit=final-13;document.getElementById('result').innerHTML=`<div class="result"><b>Simulation finished</b><br>Starting total: 13.00 SOL<br>Ending value: <b>${final.toFixed(2)} SOL</b><br>Practice gain/loss: <b>${profit>=0?'+':''}${profit.toFixed(2)} SOL</b><br><br>Wallets 10–13 stayed in reserve.</div>`;render()}function spot(){document.getElementById('lesson').innerHTML=`<div class="lesson"><h2>Spot the Manipulation</h2><p>A fictional token suddenly appears extremely active. Your job is to recognize warning signs—not reproduce the activity.</p><div class="flag"><b>Artificial-volume warning:</b> repeated back-and-forth activity can make trading volume look stronger than genuine demand.</div><div class="flag"><b>Coordinated-wallet warning:</b> several wallets acting at nearly the same time can indicate they may be controlled or directed together.</div><div class="flag"><b>Common-funding warning:</b> supposedly independent wallets that trace back to the same funding source deserve extra scrutiny.</div><div class="flag"><b>Concentration warning:</b> many visible wallets can still represent one concentrated owner or group.</div><div class="flag"><b>Decoy-wallet warning:</b> a conspicuously successful wallet may attract copy traders while related wallets behave differently.</div><p><b>Senior rule:</b> high volume and many wallets do not automatically mean many genuine buyers. Check wallet relationships, funding patterns, concentration and timing before trusting what the chart appears to show.</p><p class="small">These are detection concepts only. This simulator does not generate real transactions, artificial volume, coordinated market activity or wallet-obfuscation instructions.</p></div>`}function resetSim(){init()}init();</script></body></html>
