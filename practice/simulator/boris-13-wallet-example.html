const en=['← Return to Main Page','13-Wallet Closed Market Lab','PRACTICE ONLY.','13 fictional wallets × 1 practice unit. No blockchain connection, wallet keys or real transactions.','This closed simulation demonstrates staged entries and exits and synthetic warning patterns for manipulation awareness.','Run Full Scenario','Next Step','Reveal Hidden Wallet Links','Reset','Market','13 Wallets','Event Log','Price','Displayed volume','Closed-lab event','All prices, volume and wallet relationships are synthetic variables inside this page.','Starting capital','Current combined value','P/L','Wallets used','Synthetic price','Displayed synthetic volume index','Many wallets do not necessarily mean many independent traders.','Wallet','Reserve','Leader / decoy display','Holding','Exited','Trades','Value','Realized','Wallet Relationship Investigator','These fictional wallets can look independent. Synthetic forensic clues below demonstrate how analysts may detect common control.','Timing cluster: related wallets act in the same simulated event window.','Funding clue: some wallets share a fictional common-origin tag.','Behavior fingerprint: several wallets enter and exit around the same synthetic events.','Concentration clue: grouping related wallets can reveal a larger combined position.','Leader/decoy clue: a visibly successful wallet may belong to the same synthetic cluster.','Detection lesson: examine timing, relationships, funding provenance, behavior and combined concentration.','This defensive lesson does not teach concealment of real wallet ownership.'];
const A={fr:['← Retour à la page principale','Laboratoire fermé à 13 portefeuilles','PRATIQUE UNIQUEMENT.','13 portefeuilles fictifs × 1 unité de pratique. Aucune blockchain, clé ou transaction réelle.','Cette simulation fermée montre des entrées et sorties échelonnées et des signaux synthétiques pour reconnaître la manipulation.','Exécuter le scénario complet','Étape suivante','Révéler les liens cachés','Réinitialiser','Marché','13 portefeuilles','Journal des événements','Prix','Volume affiché','Événement du laboratoire','Tous les prix, volumes et relations entre portefeuilles sont synthétiques.','Capital initial','Valeur combinée actuelle','G/P','Portefeuilles utilisés','Prix synthétique','Indice de volume synthétique affiché','Plusieurs portefeuilles ne signifient pas nécessairement plusieurs traders indépendants.','Portefeuille','Réserve','Affichage leader / leurre','En position','Sorti','Transactions','Valeur','Réalisé','Enquêteur des relations entre portefeuilles','Ces portefeuilles fictifs peuvent sembler indépendants. Les indices synthétiques montrent comment détecter un contrôle commun.','Groupe temporel : des portefeuilles liés agissent dans la même fenêtre simulée.','Indice de financement : certains partagent une origine fictive commune.','Empreinte comportementale : plusieurs entrent et sortent autour des mêmes événements.','Indice de concentration : regrouper les portefeuilles liés révèle une position combinée plus grande.','Indice leader/leurre : un portefeuille visiblement performant peut appartenir au même groupe synthétique.','Leçon de détection : examinez le timing, les relations, l’origine des fonds, le comportement et la concentration combinée.','Cette leçon défensive n’enseigne pas à dissimuler la propriété réelle des portefeuilles.'],es:['← Volver a la página principal','Laboratorio cerrado de 13 billeteras','SOLO PRÁCTICA.','13 billeteras ficticias × 1 unidad de práctica. Sin conexión blockchain, claves ni transacciones reales.','Esta simulación cerrada muestra entradas y salidas escalonadas y señales sintéticas para reconocer manipulación.','Ejecutar escenario completo','Siguiente paso','Revelar vínculos ocultos','Reiniciar','Mercado','13 billeteras','Registro de eventos','Precio','Volumen mostrado','Evento del laboratorio','Todos los precios, volúmenes y relaciones entre billeteras son variables sintéticas.','Capital inicial','Valor combinado actual','G/P','Billeteras usadas','Precio sintético','Índice de volumen sintético mostrado','Muchas billeteras no significan necesariamente muchos operadores independientes.','Billetera','Reserva','Líder / señuelo','Manteniendo','Salió','Operaciones','Valor','Realizado','Investigador de relaciones entre billeteras','Estas billeteras ficticias pueden parecer independientes. Las pistas sintéticas muestran cómo detectar control común.','Grupo temporal: billeteras relacionadas actúan en la misma ventana simulada.','Pista de financiación: algunas comparten un origen ficticio común.','Huella de comportamiento: varias entran y salen alrededor de los mismos eventos.','Pista de concentración: agrupar billeteras relacionadas revela una posición combinada mayor.','Pista líder/señuelo: una billetera visiblemente exitosa puede pertenecer al mismo grupo sintético.','Lección de detección: examine tiempo, relaciones, origen de fondos, comportamiento y concentración combinada.','Esta lección defensiva no enseña a ocultar la propiedad real de billeteras.'],hr:['← Povratak na glavnu stranicu','Laboratorij zatvorenog tržišta s 13 novčanika','SAMO ZA VJEŽBU.','13 izmišljenih novčanika × 1 jedinica za vježbu. Nema blockchain veze, ključeva ni stvarnih transakcija.','Ova zatvorena simulacija prikazuje postupne ulaze i izlaze te sintetičke znakove za prepoznavanje manipulacije.','Pokreni cijeli scenarij','Sljedeći korak','Otkrij skrivene veze novčanika','Ponovno postavi','Tržište','13 novčanika','Dnevnik događaja','Cijena','Prikazani volumen','Događaj laboratorija','Sve cijene, volumen i odnosi novčanika sintetičke su varijable na ovoj stranici.','Početni kapital','Trenutačna ukupna vrijednost','Dobit/gubitak','Korišteni novčanici','Sintetička cijena','Prikazani indeks sintetičkog volumena','Mnogo novčanika ne znači nužno mnogo neovisnih trgovaca.','Novčanik','Rezerva','Prikaz vođe / mamca','Drži','Izašao','Trgovine','Vrijednost','Realizirano','Istražitelj odnosa novčanika','Ovi izmišljeni novčanici mogu izgledati neovisno. Sintetički forenzički tragovi pokazuju kako analitičari mogu otkriti zajedničku kontrolu.','Vremenska skupina: povezani novčanici djeluju u istom simuliranom vremenskom prozoru.','Trag financiranja: neki novčanici dijele izmišljenu zajedničku oznaku podrijetla.','Obrazac ponašanja: nekoliko novčanika ulazi i izlazi oko istih sintetičkih događaja.','Trag koncentracije: grupiranje povezanih novčanika može otkriti veći zajednički položaj.','Trag vođe/mamca: vidljivo uspješan novčanik može pripadati istoj sintetičkoj skupini.','Lekcija otkrivanja: provjerite vrijeme, odnose, podrijetlo sredstava, ponašanje i ukupnu koncentraciju.','Ova obrambena lekcija ne podučava skrivanje stvarnog vlasništva novčanika.'],tl:['← Bumalik sa Pangunahing Pahina','13-Wallet na Saradong Market Lab','PANG-PRACTICE LAMANG.','13 kathang-isip na wallet × 1 practice unit. Walang koneksyon sa blockchain, wallet key, o totoong transaksyon.','Ipinapakita ng saradong simulation na ito ang paunti-unting pagpasok at paglabas at mga sintetikong babala para makilala ang manipulasyon.','Patakbuhin ang Buong Scenario','Susunod na Hakbang','Ipakita ang Nakatagong Ugnayan ng Wallet','I-reset','Merkado','13 Wallet','Talaan ng mga Pangyayari','Presyo','Ipinapakitang volume','Pangyayari sa lab','Lahat ng presyo, volume, at ugnayan ng wallet ay sintetikong variable lamang sa pahinang ito.','Panimulang kapital','Kasalukuyang pinagsamang halaga','Kita/Lugi','Mga wallet na ginamit','Sintetikong presyo','Ipinapakitang sintetikong volume index','Ang maraming wallet ay hindi nangangahulugang maraming independiyenteng trader.','Wallet','Reserba','Leader / decoy display','May hawak','Lumabas','Mga trade','Halaga','Na-realize','Tagasuri ng Ugnayan ng Wallet','Maaaring magmukhang independiyente ang mga kathang-isip na wallet na ito. Ipinapakita ng sintetikong forensic clues kung paano matutukoy ang iisang kontrol.','Timing cluster: kumikilos ang magkakaugnay na wallet sa parehong simuladong oras.','Funding clue: may ilang wallet na may iisang kathang-isip na pinagmulan.','Behavior fingerprint: ilang wallet ang pumapasok at lumalabas sa parehong sintetikong pangyayari.','Concentration clue: ang pagsasama ng magkakaugnay na wallet ay maaaring magpakita ng mas malaking pinagsamang posisyon.','Leader/decoy clue: ang isang mukhang matagumpay na wallet ay maaaring kabilang sa parehong sintetikong grupo.','Aral sa pagtukoy: suriin ang timing, ugnayan, pinagmulan ng pondo, kilos, at pinagsamang concentration.','Ang depensibong aral na ito ay hindi nagtuturo kung paano itago ang tunay na pagmamay-ari ng wallet.'],ja:['← メインページに戻る','13ウォレット・クローズド市場ラボ','練習専用。','架空の13ウォレット × 練習用1単位。ブロックチェーン接続、ウォレット鍵、実取引はありません。','この閉鎖シミュレーションでは、段階的な売買と、操作を見抜くための合成警告パターンを示します。','全シナリオを実行','次のステップ','隠れたウォレット関係を表示','リセット','市場','13ウォレット','イベントログ','価格','表示出来高','ラボ内イベント','価格、出来高、ウォレット関係はすべてこのページ内の合成変数です。','開始資金','現在の合計価値','損益','使用ウォレット','合成価格','表示合成出来高指数','ウォレットが多くても、独立したトレーダーが多いとは限りません。','ウォレット','予備','リーダー / おとり表示','保有中','決済済み','取引回数','価値','実現損益','ウォレット関係調査','これらの架空ウォレットは独立して見える場合があります。以下の合成フォレンジック手掛かりは共通管理の発見方法を示します。','時間クラスター：関連ウォレットが同じシミュレーション時間帯に動きます。','資金の手掛かり：一部のウォレットは架空の共通出所タグを共有します。','行動パターン：複数ウォレットが同じ合成イベント付近で売買します。','集中の手掛かり：関連ウォレットをまとめると、より大きな合計ポジションが見える場合があります。','リーダー/おとりの手掛かり：目立って成功しているウォレットが同じ合成グループに属する場合があります。','検出の教訓：時間、関係、資金の出所、行動、合計集中度を調べます。','この防御的な教材は、実際のウォレット所有権を隠す方法を教えるものではありません。'],'zh-cn':['← 返回主页','13钱包封闭市场实验室','仅限练习。','13个虚构钱包 × 1个练习单位。无区块链连接、钱包密钥或真实交易。','这个封闭模拟展示分阶段进出场，以及用于识别操纵的合成警示模式。','运行完整情景','下一步','显示隐藏的钱包关联','重置','市场','13个钱包','事件日志','价格','显示成交量',' ظ تشترك في وسم منشأ خيالي مشترك.','بصمة السلوك: عدة محافظ تدخل وتخرج حول الأحداث الاصطناعية نفسها.','دليل التركّز: تجميع المحافظ المرتبطة قد يكشف مركزاً مشتركاً أكبر.','دليل القائد/الطُعم: قد تنتمي محفظة ناجحة ظاهرياً إلى المجموعة الاصطناعية نفسها.','درس الكشف: افحص التوقيت والعلاقات ومصدر التمويل والسلوك والتركيز المجمع.','هذا الدرس الدفاعي لا يعلّم إخفاء الملكية الحقيقية للمحافظ.'],no:['← Tilbake til hovedsiden','Lukket markedslab med 13 lommebøker','KUN ØVING.','13 fiktive lommebøker × 1 øvingsenhet. Ingen blokkjede, lommeboknøkler eller ekte transaksjoner.','Denne lukkede simuleringen viser trinnvise innganger og utganger og syntetiske varselsmønstre for å kjenne igjen manipulasjon.','Kjør hele scenarioet','Neste trinn','Vis skjulte lommebokkoblinger','Tilbakestill','Marked','13 lommebøker','Hendelseslogg','Pris','Vist volum','Lab-hendelse','Alle priser, volum og lommebokforhold er syntetiske variabler på denne siden.','Startkapital','Nåværende samlet verdi','G/T','Brukte lommebøker','Syntetisk pris','Vist syntetisk volumindeks','Mange lommebøker betyr ikke nødvendigvis mange uavhengige tradere.','Lommebok','Reserve','Leder / lokkemiddel','Beholder','Avsluttet','Handler','Verdi','Realisert','Etterforsker av lommebokforhold','Disse fiktive lommebøkene kan se uavhengige ut. Syntetiske spor viser hvordan analytikere kan oppdage felles kontroll.','Tidsklynge: relaterte lommebøker handler i samme simulerte tidsvindu.','Finansieringsspor: noen lommebøker deler en fiktiv felles opprinnelseskode.','Atferdsavtrykk: flere lommebøker går inn og ut rundt de samme syntetiske hendelsene.','Konsentrasjonsspor: gruppering av relaterte lommebøker kan vise en større samlet posisjon.','Leder/lokkemiddel-spor: en synlig vellykket lommebok kan tilhøre samme syntetiske gruppe.','Deteksjonslære: undersøk timing, relasjoner, finansieringsopprinnelse, atferd og samlet konsentrasjon.','Denne defensive leksjonen lærer ikke hvordan reelt lommebokeierskap skjules.'],sv:['← Tillbaka till huvudsidan','Slutet marknadslabb med 13 plånböcker','ENDAST ÖVNING.','13 fiktiva plånböcker × 1 övningsenhet. Ingen blockkedjeanslutning, plånboksnycklar eller riktiga transaktioner.','Denna slutna simulering visar stegvisa in- och utgångar samt syntetiska varningsmönster för att känna igen manipulation.','Kör hela scenariot','Nästa steg','Visa dolda plånbokslänkar','Återställ','Marknad','13 plånböcker','Händelselogg','Pris','Visad volym','Labbhändelse','Alla priser, volymer och plånboksrelationer är syntetiska variabler på denna sida.','Startkapital','Nuvarande sammanlagt värde','V/F','Använda plånböcker','Syntetiskt pris','Visat syntetiskt volymindex','Många plånböcker betyder inte nödvändigtvis många oberoende handlare.','Plånbok','Reserv','Ledare / lockbete','Innehav','Avslutad','Affärer','Värde','Realiserat','Utredare av plånboksrelationer','Dessa fiktiva plånböcker kan se oberoende ut. Syntetiska forensiska ledtrådar visar hur gemensam kontroll kan upptäckas.','Tidskluster: relaterade plånböcker agerar i samma simulerade tidsfönster.','Finansieringsledtråd: vissa plånböcker delar en fiktiv gemensam ursprungstagg.','Beteendeavtryck: flera plånböcker går in och ut kring samma syntetiska händelser.','Koncentrationsledtråd: gruppering av relaterade plånböcker kan visa en större gemensam position.','Ledare/lockbete: en synligt framgångsrik plånbok kan tillhöra samma syntetiska grupp.','Detektionsläxa: granska timing, relationer, finansieringens ursprung, beteende och samlad koncentration.','Denna defensiva lektion lär inte ut hur verkligt plånboksägande döljs.'],az:['← Əsas səhifəyə qayıt','13 pul kisəli qapalı bazar laboratoriyası','YALNIZ TƏCRÜBƏ.','13 uydurma pul kisəsi × 1 təcrübə vahidi. Blockchain bağlantısı, pul kisəsi açarları və real əməliyyatlar yoxdur.','Bu qapalı simulyasiya mərhələli giriş-çıxışları və manipulyasiyanı tanımaq üçün sintetik xəbərdarlıq nümunələrini göstərir.','Tam ssenarini işə sal','Növbəti addım','Gizli pul kisəsi əlaqələrini göstər','Sıfırla','Bazar','13 pul kisəsi','Hadisə jurnalı','Qiymət','Göstərilən həcm','Laboratoriya hadisəsi','Bütün qiymətlər, həcmlər və pul kisəsi əlaqələri bu səhifədə sintetik dəyişənlərdir.','Başlanğıc kapitalı','Cari ümumi dəyər','M/Z','İstifadə olunan pul kisələri','Sintetik qiymət','Göstərilən sintetik həcm indeksi','Çoxlu pul kisəsi mütləq çoxlu müstəqil treyder demək deyil.','Pul kisəsi','Ehtiyat','Lider / yem görüntüsü','Saxlanılır','Çıxıb','Əməliyyatlar','Dəyər','Reallaşdırılmış','Pul kisəsi əlaqələri araşdırıcısı','Bu uydurma pul kisələri müstəqil görünə bilər. Sintetik forensik ipucları ümumi nəzarətin necə aşkar edilə biləcəyini göstərir.','Vaxt klasteri: əlaqəli pul kisələri eyni simulyasiya edilmiş vaxt pəncərəsində hərəkət edir.','Maliyyələşmə ipucu: bəzi pul kisələri uydurma ümumi mənşə etiketini paylaşır.','Davranış izi: bir neçə pul kisəsi eyni sintetik hadisələr ətrafında daxil olur və çıxır.','Konsentrasiya ipucu: əlaqəli pul kisələrini qruplaşdırmaq daha böyük ümumi mövqeyi göstərə bilər.','Lider/yem ipucu: görünən uğurlu pul kisəsi eyni sintetik qrupa aid ola bilər.','Aşkarlama dərsi: vaxtı, əlaqələri, maliyyə mənşəyini, davranışı və ümumi konsentrasiyanı yoxlayın.','Bu müdafiə dərsi real pul kisəsi sahibliyini gizlətməyi öyrətmir.'],uk:['← Повернутися на головну сторінку','Закрита ринкова лабораторія з 13 гаманцями','ЛИШЕ ДЛЯ ПРАКТИКИ.','13 вигаданих гаманців × 1 навчальна одиниця. Без підключення до блокчейну, ключів гаманців чи реальних транзакцій.','Ця закрита симуляція показує поетапні входи й виходи та синтетичні попереджувальні ознаки для розпізнавання маніпуляцій.','Запустити весь сценарій','Наступний крок','Показати приховані зв’язки гаманців','Скинути','Ринок','13 гаманців','Журнал подій','Ціна','Показаний обсяг','Подія лабораторії','Усі ціни, обсяги та зв’язки гаманців є синтетичними змінними на цій сторінці.','Початковий капітал','Поточна сукупна вартість','П/З','Використані гаманці','Синтетична ціна','Показаний індекс синтетичного обсягу','Багато гаманців не обов’язково означають багато незалежних трейдерів.','Гаманець','Резерв','Лідер / приманка','Утримує','Вийшов','Угоди','Вартість','Реалізовано','Дослідник зв’язків гаманців','Ці вигадані гаманці можуть виглядати незалежними. Синтетичні криміналістичні ознаки показують, як виявляти спільний контроль.','Часовий кластер: пов’язані гаманці діють в одному змодельованому часовому вікні.','Ознака фінансування: деякі гаманці мають спільну вигадану мітку походження.','Поведінковий відбиток: кілька гаманців входять і виходять біля тих самих синтетичних подій.','Ознака концентрації: групування пов’язаних гаманців може показати більшу сукупну позицію.','Ознака лідера/приманки: помітно успішний гаманець може належати до тієї самої синтетичної групи.','Урок виявлення: перевіряйте час, зв’язки, походження коштів, поведінку та сукупну концентрацію.','Цей захисний урок не навчає приховувати реальне володіння гаманцями.'],nl:['← Terug naar hoofdpagina','Gesloten marktlab met 13 wallets','ALLEEN OEFENEN.','13 fictieve wallets × 1 oefeneenheid. Geen blockchainverbinding, walletsleutels of echte transacties.','Deze gesloten simulatie toont gefaseerde in- en uitstappen en synthetische waarschuwingspatronen om manipulatie te herkennen.','Volledig scenario uitvoeren','Volgende stap','Verborgen walletrelaties tonen','Opnieuw instellen','Markt','13 wallets','Gebeurtenissenlog','Prijs','Getoond volume','Labgebeurtenis','Alle prijzen, volumes en walletrelaties zijn synthetische variabelen binnen deze pagina.','Startkapitaal','Huidige gecombineerde waarde','W/V','Gebruikte wallets','Synthetische prijs','Getoonde synthetische volume-index','Veel wallets betekenen niet noodzakelijk veel onafhankelijke handelaren.','Wallet','Reserve','Leider / lokmiddel','In bezit','Uitgestapt','Transacties','Waarde','Gerealiseerd','Onderzoeker van walletrelaties','Deze fictieve wallets kunnen onafhankelijk lijken. Synthetische forensische aanwijzingen tonen hoe gezamenlijke controle kan worden ontdekt.','Tijdcluster: gerelateerde wallets handelen in hetzelfde gesimuleerde tijdvenster.','Financieringsaanwijzing: sommige wallets delen een fictieve gemeenschappelijke herkomsttag.','Gedragsvingerafdruk: meerdere wallets stappen rond dezelfde synthetische gebeurtenissen in en uit.','Concentratieaanwijzing: groeperen van gerelateerde wallets kan een grotere gecombineerde positie tonen.','Leider/lokmiddel-aanwijzing: een zichtbaar succesvolle wallet kan tot dezelfde synthetische groep behoren.','Detectieles: onderzoek timing, relaties, herkomst van financiering, gedrag en gecombineerde concentratie.','Deze defensieve les leert niet hoe werkelijk walleteigendom kan worden verborgen.'],fa:['← بازگشت به صفحه اصلی','آزمایشگاه بازار بسته ۱۳ کیف پول','فقط برای تمرین.','۱۳ کیف پول ساختگی × ۱ واحد تمرینی. بدون اتصال بلاکچین، کلید کیف پول یا تراکنش واقعی.','این شبیه‌سازی بسته ورود و خروج مرحله‌ای و الگوهای هشدار مصنوعی برای تشخیص دستکاری را نشان می‌دهد.','اجرای سناریوی کامل','مرحله بعد','نمایش ارتباط‌های پنهان کیف پول','بازنشانی','بازار','۱۳ کیف پول','گزارش رویدادها','قیمت','حجم نمایش‌داده‌شده','رویداد آزمایشگاه','همه قیمت‌ها، حجم‌ها و روابط کیف پول متغیرهای مصنوعی در همین صفحه هستند.','سرمایه آغازین','ارزش ترکیبی فعلی','سود/زیان','کیف پول‌های استفاده‌شده','قیمت مصنوعی','شاخص حجم مصنوعی نمایش‌داده‌شده','تعداد زیاد کیف پول لزوماً به معنی تعداد زیاد معامله‌گر مستقل نیست.','کیف پول','ذخیره','نمایش رهبر / طعمه','در حال نگهداری','خارج شده','معاملات','ارزش','تحقق‌یافته','بررسی‌کننده روابط کیف پول','این کیف پول‌های ساختگی ممکن است مستقل به نظر برسند. سرنخ‌های جرم‌شناسی مصنوعی نشان می‌دهند چگونه کنترل مشترک قابل تشخیص است.','خوشه زمانی: کیف پول‌های مرتبط در یک بازه زمانی شبیه‌سازی‌شده عمل می‌کنند.','سرنخ تأمین مالی: برخی کیف پول‌ها برچسب منشأ ساختگی مشترک دارند.','اثر رفتاری: چند کیف پول پیرامون همان رویدادهای مصنوعی وارد و خارج می‌شوند.','سرنخ تمرکز: گروه‌بندی کیف پول‌های مرتبط می‌تواند موقعیت ترکیبی بزرگ‌تری را آشکار کند.','سرنخ رهبر/طعمه: یک کیف پول ظاهراً موفق ممکن است متعلق به همان گروه مصنوعی باشد.','درس تشخیص: زمان‌بندی، روابط، منشأ تأمین مالی، رفتار و تمرکز ترکیبی را بررسی کنید.','این درس دفاعی روش پنهان کردن مالکیت واقعی کیف پول را آموزش نمی‌دهد.']};

const events=[{p:10,v:8,b:[1,2,3],s:[]},{p:12,v:18,b:[4,5],s:[]},{p:8.5,v:14,b:[],s:[2]},{p:10.5,v:24,b:[6,7,8],s:[]},{p:14,v:38,b:[],s:[1,3,4,5]},{p:11,v:31,b:[9,10,11],s:[]},{p:17,v:55,b:[],s:[6,7,8,9]},{p:7,v:20,b:[],s:[]}];let wallets=[],i=0,displayVol=0,L='en';const q=id=>document.getElementById(id),tr=k=>T[L][k];function init(){wallets=Array.from({length:13},(_,x)=>({id:x+1,cash:1,tok:0,real:0,trades:0,status:x===0?'leader':'reserve'}));i=0;displayVol=0;q('log').innerHTML='';q('links').innerHTML='';draw(10);stats(10)}function buy(ids,p){ids.forEach(n=>{let w=wallets[n-1];if(w.cash){w.tok=w.cash/p;w.cash=0;w.trades++;w.status='holding'}})}function sell(ids,p){ids.forEach(n=>{let w=wallets[n-1];if(w.tok){let z=w.tok*p;w.real+=z-1;w.cash=z;w.tok=0;w.trades++;w.status='exited'}})}function val(w,p){return w.cash+w.tok*p}function draw(p){q('wallets').innerHTML=wallets.map(w=>`<div class="card"><b>${tr('wallet')} ${w.id}</b><br>${tr(w.status)}<br>${tr('trades')}: ${w.trades}<br>${tr('value')}: ${val(w,p).toFixed(2)}<br>${tr('realized')}: ${w.real>=0?'+':''}${w.real.toFixed(2)}</div>`).join('')}function stats(p){let t=wallets.reduce((s,w)=>s+val(w,p),0),a=wallets.filter(w=>w.trades).length;q('stats').innerHTML=`${tr('start')}: <b>13.00</b> &nbsp; ${tr('current')}: <b>${t.toFixed(2)}</b> &nbsp; ${tr('pl')}: <b>${t>=13?'+':''}${(t-13).toFixed(2)}</b><br>${tr('used')}: ${a}/13`;q('market').innerHTML=`${tr('synPrice')}: <b>$${p.toFixed(2)}</b><br>${tr('synVol')}: <b>${displayVol}</b><div class="bar" style="width:${Math.min(displayVol,100)}%"></div><span class="warn">${tr('warning')}</span>`}function step(){if(i>=events.length)return;let e=events[i];buy(e.b,e.p);sell(e.s,e.p);displayVol=e.v;q('log').innerHTML+=`<tr><td>${i+1}</td><td>$${e.p.toFixed(2)}</td><td>${e.v}</td><td>${tr('event')}</td></tr>`;draw(e.p);stats(e.p);i++}function start(){init();while(i<events.length)step()}function revealLinks(){q('links').innerHTML=`<div class="panel"><h2>${tr('investigator')}</h2><p>
