ی.','مقایسه منصفانه: هر دو روش با ۱۳ SOL شروع می‌کنند و از یک مسیر قیمت استفاده می‌کنند.','اجرای شبیه‌سازی','بازنشانی','باز کردن آزمایشگاه کامل ۱۳ کیف پول','نمودار','یک کیف پول','۱۳ کیف پول','تراکنش‌ها','ارزش یک کیف پول در برابر ۱۳ کیف پول','تمام ۱۳ SOL در $10 وارد می‌شود و در همان مسیر قیمت باقی می‌ماند.','روش مرحله‌ای ۱۳ کیف پول','تراکنش‌های شبیه‌سازی‌شده','مرحله','قیمت','روش ۱۳ کیف پول','همه مقادیر شبیه‌سازی هستند و بازده تضمین نمی‌شود.']};const ids=['home','title','practice','fair','run','reset','lab','tg','ts','tm','tt','graphTitle','singleDesc','multiTitle','txTitle','step','price','multiHead','disc'];let L='en',wallets=[],multiVals=[];const prices=[10,8.5,11,9,12,7],singleVals=prices.map(p=>13*p/10);function apply(){L=lang.value;localStorage.setItem('cfsLang',L);document.documentElement.lang=L;document.documentElement.dir=['ar','fa'].includes(L)?'rtl':'ltr';ids.forEach((id,i)=>document.getElementById(id).textContent=T[L][i]);singleTitle.textContent=T[L][8];singleHead.textContent=T[L][8];if(multiVals.length)run()}function init(){wallets=Array.from({length:13},(_,i)=>({id:i+1,cash:1,token:0,status:'Reserve'}));multiVals=[];singleResult.innerHTML='';multiResult.innerHTML='';document.getElementById('wallets').innerHTML='';tx.innerHTML='';draw([],[])}function buy(a,p){a.forEach(n=>{let w=wallets[n-1];w.token=w.cash/p;w.cash=0;w.status='BUY @ $'+p})}function sell(a,p){a.forEach(n=>{let w=wallets[n-1];w.cash=w.token*p;w.token=0;w.status='SELL @ $'+p})}function val(w,p){return w.cash+w.token*p}function total(p){return wallets.reduce((s,w)=>s+val(w,p),0)}function snap(p){multiVals.push(total(p))}function run(){init();buy([1,2,3],10);snap(10);buy([4,5,6],8.5);snap(8.5);sell([1,2],11);snap(11);buy([7,8,9],9);snap(9);sell([3,4,5,6,7,8,9],12);snap(12);snap(7);let se=singleVals[5],me=multiVals[5];singleResult.innerHTML=`13.00 SOL → <b>${se.toFixed(2)} SOL</b> (${(se-13).toFixed(2)} SOL)`;multiResult.innerHTML=`13.00 SOL → <b>${me.toFixed(2)} SOL</b> (+${(me-13).toFixed(2)} SOL)`;document.getElementById('wallets').innerHTML=wallets.map(w=>`<div class="card"><b>Wallet ${w.id}</b><br>${w.status}<br>${val(w,7).toFixed(2)} SOL</div>`).join('');let s=['BUY 13 SOL','HOLD','HOLD','HOLD','HOLD','HOLD'],m=['W1–3 BUY','W4–6 BUY','W1–2 SELL','W7–9 BUY','W3–9 SELL','FINAL VALUE'];tx.innerHTML=prices.map((p,i)=>`<tr><td>${i+1}</td><td>$${p}</td><td>${s[i]} — ${singleVals[i].toFixed(2)}</td><td>${m[i]} — ${multiVals[i].toFixed(2)}</td></tr>`).join('');draw(singleVals,multiVals)}function draw(a,b){let c=chart,x=c.getContext('2d'),W=c.width,H=c.height,p=55;x.clearRect(0,0,W,H);x.strokeStyle='#666';x.beginPath();x.moveTo(p,20);x.lineTo(p,H-p);x.lineTo(W-20,H-p);x.stroke();if(!a.length)return;let z=a.concat(b),mn=Math.min(...z)-1,mx=Math.max(...z)+1,py=v=>20+(mx-v)/(mx-mn)*(H-p-20),px=i=>p+i*(W-p-35)/(prices.length-1);[a,b].forEach((q,k)=>{x.strokeStyle=k?'#8ee6a8':'#9fd3ff';x.lineWidth=4;x.beginPath();q.forEach((v,i)=>i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)));x.stroke()});x.fillStyle='#eee';prices.forEach((v,i)=>x.fillText('$'+v,px(i)-10,H-25))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.tab').forEach(e=>e.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});run.onclick=run;reset.onclick=init;lang.onchange=apply;let saved=localStorage.getItem('cfsLang')||'en';if(T[saved])lang.value=saved;apply();init();</script></body></html>
