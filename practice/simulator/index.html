<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice Simulator</title>
<style>
body { background:#111; color:#eee; font-family:Arial,sans-serif; text-align:center; padding:20px; }
button,.lesson { display:inline-block; padding:10px 20px; margin:14px; font-size:16px; }
.lesson { background:#183323; color:#eee; border:1px solid #3d8; border-radius:6px; text-decoration:none; }
.notice { max-width:900px; margin:0 auto 16px; padding:12px; background:#183323; border:1px solid #3d8; }
canvas { border:1px solid #333; margin-top:20px; max-width:100%; height:auto; }
#out { display:none; margin-top:20px; }
</style>
</head>
<body>
<h1>Practice Simulator</h1>
<div class="notice"><strong>PRACTICE MODE — NO REAL MONEY.</strong> Learn with simulated market scenarios before considering any real-world activity.</div>
<button id="run">Run Simulation</button>
<a class="lesson" href="boris-13-wallet-example.html">Open Boris 13-Wallet Example</a>
<br>
<canvas id="chart" width="900" height="300"></canvas>
<div id="out"></div>
<script>
window.onload = function() {
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
function generateChart() {
  let data = [];
  let value = 10;
  for (let i = 0; i < 80; i++) {
    if (i < 20) value += Math.random()*1.5;
    else if (i === 25) value += 15;
    else if (i > 25 && i < 40) value += (Math.random()*2 - 0.5);
    else if (i === 45) value -= 25;
    else value += (Math.random() - 0.5);
    data.push(value);
  }
  return data;
}
function drawChart(data) {
  ctx.clearRect(0,0,900,300);
  ctx.strokeStyle = "#eee";
  ctx.beginPath();
  ctx.moveTo(0,250 - data[0]*5);
  data.forEach((v,i)=>ctx.lineTo(i*10,250-v*5));
  ctx.stroke();
}
function drawLabels() {
  ctx.fillStyle = "#ff7777";
  ctx.fillText("Pump",250,50);
  ctx.fillText("Trap",350,60);
  ctx.fillText("Dump",450,100);
}
function runSim() {
  const chart=generateChart(); drawChart(chart); drawLabels();
  const entry=chart[30], exit=chart[79];
  const single=exit-entry;
  const multi=(chart[25]-chart[10])+(chart[35]-chart[20])+(chart[40]-chart[30]);
  document.getElementById("out").innerText="Single Wallet: "+single.toFixed(2)+" | Multi-entry example: "+multi.toFixed(2)+" — simulated values only";
  document.getElementById("out").style.display="block";
}
document.getElementById("run").onclick=runSim;
};
</script>
</body>
</html>
