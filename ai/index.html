<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Assisted Help</title><style>body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,sans-serif}header{padding:14px 20px;background:#111;display:flex;justify-content:space-between}a,h1,h2{color:#9fd3ff}a{text-decoration:none;font-weight:bold}select{background:#1a1a1a;color:#eee;padding:8px}main{max-width:900px;margin:auto;padding:40px 20px}.s{margin:24px 0;padding:20px;background:#121212;border:1px solid #333;border-radius:8px}</style></head><body><header><a href="../" id="back"></a><select id="lang"></select></header><main><h1 id="title"></h1><p id="intro"></p><div class="s"><h2 id="does"></h2><ul id="doesList"></ul></div><div class="s"><h2 id="never"></h2><ul id="neverList"></ul></div><div class="s"><h2 id="why"></h2><p id="whyText"></p></div><p id="notice"></p></main><script src="../assets/translations.js"></script><script src="../assets/i18n.js"></script><script>const N={en:'English',fr:'Français',es:'Español',hr:'Hrvatski',tl:'Filipino',ja:'日本語','zh-cn':'中文（简体）','zh-tw':'中文（繁體）',ar:'العربية',no:'Norsk',sv:'Svenska',az:'Azərbaycanca',uk:'Українська',nl:'Nederlands',fa:'فارسی'};const B={en:'← Return to Main Page',fr:'← Retour à la page principale',es:'← Volver a la página principal',hr:'← Povratak na glavnu stranicu',tl:'← Bumalik sa Pangunahing Pahina',ja:'← メインページに戻る','zh-cn':'← 返回主页','zh-tw':'← 返回主頁',ar:'← العودة إلى الصفحة الرئيسية',no:'← Tilbake til hovedsiden',sv:'← Tillbaka till huvudsidan',az:'← Əsas səhifəyə qayıt',uk:'← Повернутися на головну',nl:'← Terug naar hoofdpagina',fa:'← بازگشت به صفحه اصلی'};const T={en:['AI Assisted Help','AI is used strictly as an educational assistant.','What AI Does Here','Explains crypto simply|Helps with translation and accessibility|Explains risks and terminology|Supports learning at your pace','What AI Will Never Do','Trade or move funds|Connect to wallets or accounts|Promise prices or profits|Override your decisions','Why This Matters','AI should help you understand, not pressure you to act.','Informational only — not financial advice.'],fr:['Aide assistée par IA','L’IA est utilisée uniquement comme assistant éducatif.','Ce que fait l’IA','Explique simplement la crypto|Aide à traduire et à rendre accessible|Explique risques et termes|Soutient votre apprentissage','Ce que l’IA ne fera jamais','Trader ou déplacer des fonds|Connecter des portefeuilles|Promettre prix ou profits|Remplacer vos décisions','Pourquoi c’est important','L’IA doit aider à comprendre, pas pousser à agir.','Information uniquement — pas un conseil financier.'],es:['Ayuda asistida por IA','La IA se usa únicamente como asistente educativo.','Qué hace la IA','Explica cripto claramente|Ayuda con traducción y accesibilidad|Explica riesgos y términos|Apoya su aprendizaje','Lo que la IA nunca hará','Operar o mover fondos|Conectar billeteras o cuentas|Prometer precios o ganancias|Anular sus decisiones','Por qué importa','La IA debe ayudar a comprender, no presionar para actuar.','Solo información — no asesoría financiera.'],hr:['AI pomoć','AI se koristi isključivo kao edukativni pomoćnik.','Što AI radi','Jednostavno objašnjava kripto|Pomaže s prijevodom i pristupačnošću|Objašnjava rizike i pojmove|Podržava učenje','Što AI nikada neće raditi','Trgovati ili premještati sredstva|Povezivati novčanike|Obećavati cijene ili dobit|Nadjačati vaše odluke','Zašto je važno','AI treba pomoći razumjeti, a ne pritiskati na djelovanje.','Samo informacije — nije financijski savjet.'],tl:['AI na Tulong','Ginagamit lamang ang AI bilang educational assistant.','Ano ang ginagawa ng AI','Simpleng nagpapaliwanag ng crypto|Tumutulong sa translation at accessibility|Nagpapaliwanag ng risks at terms|Sumusuporta sa pag-aaral','Ano ang hindi gagawin ng AI','Mag-trade o maglipat ng pera|Kumonekta sa wallet o account|Mangako ng presyo o kita|Palitan ang iyong desisyon','Bakit mahalaga','Dapat tumulong ang AI sa pag-unawa, hindi mang-pressure.','Impormasyon lamang — hindi payong pinansyal.'],ja:['AI 学習補助','AIは教育アシスタントとしてのみ使用します。','AIがすること','暗号資産を簡単に説明|翻訳とアクセシビリティを支援|リスクと用語を説明|自分のペースの学習を支援','AIが絶対にしないこと','取引や資金移動|ウォレットや口座への接続|価格や利益の保証|あなたの判断を上書き','なぜ重要か','AIは行動を急かすのではなく理解を助けるものです。','情報提供のみ — 金融助言ではありません。'],'zh-cn':['AI 辅助帮助','AI仅作为教育助手使用。','AI在这里做什么','简单解释加密知识|帮助翻译和无障碍使用|解释风险和术语|按您的节奏支持学习','AI绝不会做什么','交易或转移资金|连接钱包或账户|承诺价格或利润|替代您的决定','为什么重要','AI应该帮助理解，而不是催促您行动。','仅供信息参考 — 不是金融建议。'],'zh-tw':['AI 輔助幫助','AI僅作為教育助手使用。','AI在這裡做什麼','簡單解釋加密知識|協助翻譯和無障礙使用|解釋風險和術語|按您的步調支援學習','AI絕不會做什麼','交易或轉移資金|連接錢包或帳戶|承諾價格或利潤|取代您的決定','為什麼重要','AI應幫助理解，而不是催促您行動。','僅供資訊參考 — 不是金融建議。'],ar:['مساعدة بالذكاء الاصطناعي','يستخدم الذكاء الاصطناعي كمساعد تعليمي فقط.','ما الذي يفعله الذكاء الاصطناعي','يشرح العملات الرقمية ببساطة|يساعد في الترجمة وإمكانية الوصول|يشرح المخاطر والمصطلحات|يدعم التعلم بالسرعة المناسبة لك','ما لن يفعله أبداً','التداول أو نقل الأموال|الاتصال بالمحافظ أو الحسابات|ضمان الأسعار أو الأرباح|تجاوز قراراتك','لماذا هذا مهم','يجب أن يساعدك الذكاء الاصطناعي على الفهم لا أن يضغط عليك للتصرف.','للمعلومات فقط — ليست نصيحة مالية.'],no:['AI-assistert hjelp','AI brukes kun som pedagogisk assistent.','Hva AI gjør','Forklarer krypto enkelt|Hjelper med oversettelse og tilgjengelighet|Forklarer risiko og begreper|Støtter læring i ditt tempo','Hva AI aldri gjør','Handler eller flytter midler|Kobler til lommebøker eller kontoer|Lover priser eller fortjeneste|Overstyrer dine valg','Hvorfor dette er viktig','AI skal hjelpe deg å forstå, ikke presse deg til handling.','Kun informasjon — ikke finansielle råd.'],sv:['AI-assisterad hjälp','AI används endast som pedagogisk assistent.','Vad AI gör','Förklarar krypto enkelt|Hjälper med översättning och tillgänglighet|Förklarar risker och termer|Stöder lärande i din takt','Vad AI aldrig gör','Handlar eller flyttar pengar|Ansluter plånböcker eller konton|Lovar priser eller vinster|Åsidosätter dina beslut','Varför detta är viktigt','AI ska hjälpa dig förstå, inte pressa dig att agera.','Endast information — inte finansiell rådgivning.'],az:['Süni intellekt dəstəyi','AI yalnız təhsil köməkçisi kimi istifadə olunur.','AI nə edir','Kriptonu sadə izah edir|Tərcümə və əlçatanlığa kömək edir|Risk və terminləri izah edir|Öz sürətinizlə öyrənməni dəstəkləyir','AI heç vaxt nə etməyəcək','Ticarət və ya vəsait köçürmək|Pul kisəsi və hesablara qoşulmaq|Qiymət və mənfəət vəd etmək|Qərarlarınızı əvəz etmək','Niyə vacibdir','AI sizi hərəkətə məcbur etməməli, anlamağa kömək etməlidir.','Yalnız məlumat — maliyyə məsləhəti deyil.'],uk:['Допомога ШІ','ШІ використовується лише як освітній помічник.','Що робить ШІ','Просто пояснює криптовалюти|Допомагає з перекладом і доступністю|Пояснює ризики й терміни|Підтримує навчання у вашому темпі','Чого ШІ ніколи не робитиме','Торгувати або переміщувати кошти|Підключатися до гаманців чи рахунків|Обіцяти ціни або прибуток|Скасовувати ваші рішення','Чому це важливо','ШІ має допомагати розуміти, а не тиснути на вас.','Лише інформація — не фінансова порада.'],nl:['Hulp met AI','AI wordt uitsluitend gebruikt als educatieve assistent.','Wat AI hier doet','Legt crypto eenvoudig uit|Helpt met vertaling en toegankelijkheid|Legt risico’s en termen uit|Ondersteunt leren in uw tempo','Wat AI nooit doet','Handelen of geld verplaatsen|Wallets of accounts verbinden|Prijzen of winst beloven|Uw beslissingen overrulen','Waarom dit belangrijk is','AI moet helpen begrijpen, niet onder druk zetten.','Alleen informatie — geen financieel advies.'],fa:['کمک با هوش مصنوعی','هوش مصنوعی فقط به عنوان دستیار آموزشی استفاده می‌شود.','هوش مصنوعی چه می‌کند','رمزارز را ساده توضیح می‌دهد|به ترجمه و دسترسی کمک می‌کند|ریسک‌ها و اصطلاحات را توضیح می‌دهد|یادگیری با سرعت شما را پشتیبانی می‌کند','هوش مصنوعی هرگز چه نمی‌کند','معامله یا انتقال سرمایه|اتصال به کیف پول یا حساب|وعده قیمت یا سود|نادیده گرفتن تصمیم شما','چرا مهم است','هوش مصنوعی باید به فهمیدن کمک کند، نه شما را برای اقدام تحت فشار بگذارد.','فقط اطلاعات — توصیه مالی نیست.']};CFSI18n.extend('ai',T,N,B);Object.entries(N).forEach(([v,n])=>lang.add(new Option(n,v)));let li=s=>s.split('|').map(x=>'<li>'+x+'</li>').join('');function apply(l){l=CFSI18n.normalize(l);CFSI18n.select(l);document.documentElement.lang=l;document.documentElement.dir=['ar','fa'].includes(l)?'rtl':'ltr';let x=T[l];back.textContent=B[l];title.textContent=x[0];intro.textContent=x[1];does.textContent=x[2];doesList.innerHTML=li(x[3]);never.textContent=x[4];neverList.innerHTML=li(x[5]);why.textContent=x[6];whyText.textContent=x[7];notice.textContent=x[8]}let s=CFSI18n.saved();lang.value=T[s]?s:'en';apply(lang.value);lang.onchange=e=>apply(e.target.value)</script></body></html>
